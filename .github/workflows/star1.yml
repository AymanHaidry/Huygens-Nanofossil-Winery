name: Star1

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Research question'
        required: true
        type: string

permissions:
  contents: write

env:
  MODEL_REPO: bartowski/Qwen_Qwen3-4B-GGUF
  MODEL_FILE: Qwen_Qwen3-4B-Q4_K_M.gguf
  RESEARCH_QUESTION: ${{ inputs.question }}
  RESULT_PATH: result.json

jobs:
  run-star1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/
          key: ${{ runner.os }}-star1-model-${{ env.MODEL_REPO }}-${{ env.MODEL_FILE }}

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -c "
          import os
          from huggingface_hub import hf_hub_download
          repo = os.environ['MODEL_REPO']
          file = os.environ['MODEL_FILE']
          print(f'[Winery] Downloading {file} from {repo}...')
          hf_hub_download(
              repo_id=repo,
              filename=file,
              local_dir='models/'
          )
          print('[Winery] Model downloaded.')
          "

      - name: Run Winery
        run: python winery/main.py

      - name: Save result
        if: always()
        run: |
          mkdir -p results
          cp ${{ env.RESULT_PATH }} results/${{ github.run_id }}.json 2>/dev/null || echo '{"error":"no result generated"}' > results/${{ github.run_id }}.json

      - name: Commit result
        if: always()
        run: |
          git config user.name "Star1"
          git config user.email "star1@huygens.local"
          git add results/
          if git diff --staged --quiet; then
            echo "[Winery] No changes to commit."
            exit 0
          fi
          git commit -m "Result for run ${{ github.run_id }}"
          git push || echo "[Winery] Push failed — check Actions permissions in Settings."
        
